<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>注册 - MongoDB 问卷系统</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container narrow">
      <header>
        <h1>注册</h1>
        <p>创建一个账号后即可创建和管理问卷</p>
      </header>

      <section class="card">
        <form id="registerForm">
          <div class="field">
            <label for="username">用户名（3–32 个字符）</label>
            <input
              id="username"
              name="username"
              autocomplete="username"
              minlength="3"
              maxlength="32"
              autofocus
            />
          </div>
          <div class="field">
            <label for="password">密码（至少 8 位）</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
            />
          </div>
          <button type="submit">注册</button>
        </form>
        <p id="message" class="error"></p>
        <p class="hint">已有账号？<a href="/login">去登录</a></p>
      </section>
    </div>

    <script type="module" src="/register.js"></script>
  </body>
</html>
