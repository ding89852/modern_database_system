<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MongoDB 问卷系统</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="row space-between">
          <div>
            <h1>MongoDB 问卷系统</h1>
            <p>第一阶段最小前端：登录、创建示例问卷、打开填写页</p>
          </div>
          <div id="userBox" class="row hidden">
            <span id="userName" class="hint"></span>
            <button id="logoutBtn" class="secondary" type="button">退出</button>
          </div>
        </div>
      </header>

      <section id="dashboard" class="hidden">
        <section class="card">
          <div class="row space-between">
            <div>
              <h2>创建问卷</h2>
              <p class="hint">自己添加题目、选项、校验和跳转规则。</p>
            </div>
            <a class="button-like" href="/create">新建问卷</a>
          </div>
        </section>

        <section class="card">
          <h2>打开问卷</h2>
          <div class="row">
            <input
              id="slugInput"
              placeholder="输入 slug，或粘贴完整链接"
              style="flex: 1; min-width: 220px"
            />
            <button id="openSurveyBtn" type="button">打开填写页</button>
          </div>
          <p class="hint">发布后的链接形如 http://localhost:3000/survey/xxxxxxxx</p>
        </section>

        <section class="card">
          <h2>创建示例问卷</h2>
          <p class="hint">
            一键创建一份包含单选、多选、文本、数字题和精确匹配跳转的问卷，并立即发布。
          </p>
          <button id="sampleBtn" type="button">创建并发布示例问卷</button>
          <p id="sampleMessage" class="hint"></p>
        </section>

        <section class="card">
          <div class="row space-between">
            <div>
              <h2>问卷</h2>
              <div class="tabs">
                <button class="tab active" data-tab="published" type="button">我发布的</button>
                <button class="tab" data-tab="filled" type="button">我填写的</button>
              </div>
            </div>
            <button id="refreshBtn" class="secondary" type="button">刷新</button>
          </div>
          <div id="surveyList"></div>
          <p id="listMessage" class="hint"></p>
        </section>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
